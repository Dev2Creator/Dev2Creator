<svg xmlns="http://www.w3.org/2000/svg" width="265" height="36" viewBox="0 0 265 36" role="img" aria-label="py3dgame: 3D engine in Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9e4de"/>
      <stop offset="1" stop-color="#e2f0fb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="1" y="1" width="263" height="34" rx="17"/></clipPath>
  </defs>
  <rect x="1" y="1" width="263" height="34" rx="17" fill="url(#bg)"/>
  <rect x="1" y="1" width="263" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>
  <g clip-path="url(#pill)">
    <rect x="-80" y="-4" width="46" height="44" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-80;265" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M12 10l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6z" fill="#3a2c44" opacity="0.55"/>
  <text x="30" y="24" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3a2c44">py3dgame</text>
  <text x="105" y="24" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4b3a58">3D engine in Python</text>
  <path d="M251 9 l1.2 3.4 3.4 1.2 -3.4 1.2 -1.2 3.4 -1.2 -3.4 -3.4 -1.2 3.4 -1.2 z" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.25;0.95;0.25" dur="2.2s" repeatCount="indefinite"/>
  </path>
</svg>
