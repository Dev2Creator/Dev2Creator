<svg xmlns="http://www.w3.org/2000/svg" width="276" height="36" viewBox="0 0 276 36" role="img" aria-label="TransPower: offline AI companion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d6e0"/>
      <stop offset="1" stop-color="#f3d7f0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="1" y="1" width="274" height="34" rx="17"/></clipPath>
  </defs>
  <rect x="1" y="1" width="274" height="34" rx="17" fill="url(#bg)"/>
  <rect x="1" y="1" width="274" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>
  <g clip-path="url(#pill)">
    <rect x="-80" y="-4" width="46" height="44" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-80;276" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="15" y="24" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3a2c44">TransPower</text>
  <text x="108" y="24" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4b3a58">offline AI companion</text>
  <path d="M262 9 l1.2 3.4 3.4 1.2 -3.4 1.2 -1.2 3.4 -1.2 -3.4 -3.4 -1.2 3.4 -1.2 z" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.25;0.95;0.25" dur="2.2s" repeatCount="indefinite"/>
  </path>
</svg>
