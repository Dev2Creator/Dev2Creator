<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-label="Dev2Creator — polite to machines, kind to people">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="0.5" stop-color="#fdf6f7"/>
      <stop offset="1" stop-color="#f8f5fc"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbe3ea" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fbe3ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orchid" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ece4fa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ece4fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1120" height="290" fill="url(#paper)"/>
  <circle cx="210" cy="70" r="190" fill="url(#blush)">
    <animate attributeName="cx" values="210;246;210" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="230" r="210" fill="url(#orchid)">
    <animate attributeName="cx" values="920;880;920" dur="19s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(560 74)" stroke="#5b4a63" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M-11 -6c0-7 -1-11 -1-15"/>
    <path d="M9 -6c0-7 1-11 1-15"/>
    <path d="M-13 2a13 12 0 0 0 26 0 13 12 0 0 0 -26 0z" fill="#fffdfa"/>
    <circle cx="-5" cy="1" r="1.4" fill="#5b4a63" stroke="none"/>
    <circle cx="5" cy="1" r="1.4" fill="#5b4a63" stroke="none"/>
  </g>
  <text x="560" y="140" text-anchor="middle" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="54" font-weight="400" letter-spacing="1.5" fill="#3b2e42">Dev2Creator</text>
  <line x1="330" y1="172" x2="470" y2="172" stroke="#e8d9e2" stroke-width="1"/>
  <text x="560" y="177" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="4.5" fill="#9a8aa3">POLITE TO MACHINES · KIND TO PEOPLE</text>
  <line x1="650" y1="172" x2="790" y2="172" stroke="#e8d9e2" stroke-width="1"/>
  <text x="560" y="208" text-anchor="middle" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="17" font-style="italic" fill="#6d5b76">small tools, made carefully</text>
  <text x="560" y="240" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b7a95">Python · AI · game engines · developer tools — documented honestly, offline first</text>
  <g fill="#d9a7bd">
    <circle cx="300" cy="212" r="2"/>
    <circle cx="820" cy="212" r="2"/>
  </g>
