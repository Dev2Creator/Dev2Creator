<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-labelledby="title desc">
  <title id="title">A little note from the bunny</title>
  <desc id="desc">Twelve sweet reminders about creativity, coding, and being kind to yourself. A new one appears every four seconds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5f8"/>
      <stop offset="1" stop-color="#f5f0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#e8a4c0" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="9" y="9" width="502" height="132" rx="25" fill="url(#bg)" stroke="#f2c5d6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="34" cy="35" r="4" fill="#ff9fbd"/>
  <circle cx="486" cy="114" r="5" fill="#c9a8ff"/>
  <text x="260" y="47" text-anchor="middle" fill="#bd7294" font-family="Verdana, sans-serif" font-size="13" font-weight="700" letter-spacing="2">A LITTLE BUNNY REMINDER</text>
  <text x="260" y="72" text-anchor="middle" fill="#e58bab" font-family="Verdana, sans-serif" font-size="17">✿</text>

  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">Small steps still make a lovely journey. 🌷</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="0s;48s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">You can build beautiful things, one bug at a time. 🐛</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="4s;52s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">Curiosity is your cutest superpower. ✨</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="8s;56s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">Rest is part of the recipe, too. ☁️</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="12s;60s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">Your next idea might be someone’s favorite. 💡</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="16s;64s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">Make it work, then make it wonderful. 🎀</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="20s;68s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">There is magic in learning how things work. 🪄</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="24s;72s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">Be proud of the tiny things you finished. 🌼</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="28s;76s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">A kind heart and a clever mind go far. 💖</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="32s;80s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">Every expert was once a beginner. 🌱</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="36s;84s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">Keep making room for a little wonder. 🌙</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="40s;88s" fill="remove"/>
  </g>
  <g opacity="0">
    <text x="260" y="101" text-anchor="middle" fill="#594b61" font-family="Verdana, sans-serif" font-size="16" font-weight="600">You deserve the same kindness you give others. 🩷</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="44s;92s" fill="remove"/>
  </g>
  <text x="260" y="126" text-anchor="middle" fill="#b78aaa" font-family="Verdana, sans-serif" font-size="11">♡ 12 tiny notes, on a loop ♡</text>
</svg>
