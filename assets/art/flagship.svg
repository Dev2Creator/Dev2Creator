<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-label="py3dgame, the flagship project">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaff"/><stop offset="0.55" stop-color="#f8f4fe"/><stop offset="1" stop-color="#f6f0fb"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6d8fa" stop-opacity="0.9"/><stop offset="1" stop-color="#e6d8fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="678" height="248" rx="20" fill="url(#card)" stroke="#e8dcf0"/>
  <rect x="9" y="9" width="662" height="232" rx="14" fill="none" stroke="#f0e6f4"/>
  <circle cx="560" cy="70" r="110" fill="url(#halo)"/>
  <text x="42" y="52" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" letter-spacing="3.4" fill="#b08bc4">FLAGSHIP</text>
  <text x="42" y="100" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="38" font-weight="400" fill="#3b2e42">py3dgame</text>
  <text x="42" y="128" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="15.5" font-style="italic" fill="#6d5b76">a Python-native game library, built to be understood</text>
  <text x="42" y="156" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b7a95">window · fixed-timestep loop · input · scene graph · software 2D renderer</text>
  <g stroke="#d9cbe4" stroke-width="1"><line x1="42" y1="176" x2="630" y2="176"/></g>
  <text x="42" y="200" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d6b86">55 tests</text>
  <text x="120" y="200" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c3b3c9">·</text>
  <text x="136" y="200" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d6b86">no GPU required</text>
  <text x="252" y="200" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c3b3c9">·</text>
  <text x="268" y="200" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d6b86">3D pipeline in development</text>
  <g transform="translate(560 128)" stroke="#a98cc4" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M0 -42l46 24-46 24-46-24z" fill="#efe4fb"/>
    <path d="M-46 -18v36l46 24 46-24v-36"/>
    <path d="M0 6v36"/>
  </g>
</svg>
